name: Update PDF manual

# Rebuild one PDF per language whenever manual content changes on main and
# republish the rolling "pdf" GitHub release. The site's Download PDF
# buttons (extra.pdf_downloads in mkdocs.yml) link straight to those
# release assets, so no PDF is ever committed to the repo and the site
# needs no redeploy to pick up a new build.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "overrides/**"
      - "hooks/**"
      - "mkdocs.yml"
      - "scripts/build-pdf.py"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-pdf
  cancel-in-progress: true

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the git-changelog hook sees real page history.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --only-shell --with-deps

      - name: Build PDFs
        run: python scripts/build-pdf.py dist-pdf

      - name: Republish the rolling "pdf" release
        run: |
          # Recreated rather than updated in place: uploading over the old
          # asset leaves the release's tag, publish date and "Latest" badge
          # frozen at the commit the release was first cut from, so the
          # releases page reads as stale even when the attached PDF is
          # current.
          if gh release view pdf >/dev/null 2>&1; then
            gh release delete pdf --yes --cleanup-tag
          fi

          notes=$(printf '%s\n\n%s\n\n%s\n' \
            "Always the latest PDF build of the manual, regenerated automatically whenever the manual changes." \
            "One asset per language: the unsuffixed file is English, the rest carry their locale code (e.g. -es)." \
            "Built from ${GITHUB_SHA} on $(date -u +'%Y-%m-%d %H:%M UTC').")

          gh release create pdf dist-pdf/*.pdf \
            --target "$GITHUB_SHA" \
            --title "SANDARC VEC Manual (PDF)" \
            --notes "$notes"

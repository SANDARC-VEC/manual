site_name: SANDARC VEC Manual
site_url: https://vec.sandarc.org/manual/

theme:
  name: material
  custom_dir: overrides
  favicon: https://assets.sandarc.org/logo/current-logo.png
  font: false
  palette:

    - scheme: sandarc-light
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

    - scheme: sandarc-dark
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.path
    - navigation.footer
    - navigation.instant
    - navigation.instant.prefetch
    - toc.follow

extra:
  # The Download PDF buttons (hero, sidebar, footer) link here: the
  # rolling "pdf" GitHub release, refreshed by .github/workflows/
  # update-pdf.yml whenever manual content changes on main. The PDF is
  # not committed to the repo and is not part of the built site.
  #
  # pdf_url stays the English asset so anything still linking to it keeps
  # working; the buttons themselves read pdf_downloads, defaulting to the
  # PDF for the page's own language. scripts/build-pdf.py derives the
  # locale list from the i18n plugin config, so a language added there
  # must be added here too.
  pdf_url: https://github.com/SANDARC-VEC/manual/releases/download/pdf/SANDARC-VEC-Manual.pdf
  pdf_downloads:
    - locale: en
      name: English
      url: https://github.com/SANDARC-VEC/manual/releases/download/pdf/SANDARC-VEC-Manual.pdf
    - locale: es
      name: Español
      url: https://github.com/SANDARC-VEC/manual/releases/download/pdf/SANDARC-VEC-Manual-es.pdf
    - locale: ja
      name: 日本語
      url: https://github.com/SANDARC-VEC/manual/releases/download/pdf/SANDARC-VEC-Manual-ja.pdf
    - locale: nl
      name: Nederlands
      url: https://github.com/SANDARC-VEC/manual/releases/download/pdf/SANDARC-VEC-Manual-nl.pdf
    - locale: ko
      name: 한국어
      url: https://github.com/SANDARC-VEC/manual/releases/download/pdf/SANDARC-VEC-Manual-ko.pdf
  social:
    - icon: fontawesome/brands/discord
      link: https://discord.sandarc.org

copyright: Copyright &copy; 2026 San Diego County Amateur Radio Council

extra_css:
  - stylesheets/extra.css
  - stylesheets/print-site.css

plugins:
  - search
  # Translations live beside their English source as <name>.<locale>.md
  # (docs_structure: suffix, the plugin default) and are written there by
  # Crowdin. Pages with no translation yet fall back to the English text
  # rather than 404ing, so a locale can go live before it is complete.
  #
  # The nav: labels below are NOT translated: they live here rather than in
  # docs/, so Crowdin never sees them and every locale shows the English
  # section names. Add a per-language nav_translations: block once a native
  # speaker can review the labels.
  - i18n:
      languages:
        - locale: en
          name: English
          default: true
        - locale: es
          name: Español
        - locale: ja
          name: 日本語
        - locale: nl
          name: Nederlands
        - locale: ko
          name: 한국어
  - llms-source:
      source_revision: true
      description: "Official SANDARC VEC documentation. SANDARC is a Volunteer Examiner Coordinator in the United States that recruits teams of volunteer examiners to administer Amateur Radio exam sessions. This document includes VEC's official policies and guidelines on how exam sessions are conducted, how we recruit teams and examiners, and how teams can submit sessions, add new examiners to their team and overall manage their teams in accordance with SANDARC's official policies."
  # print-site must stay the LAST plugin: it collects the final rendered
  # HTML of every page to assemble the single print page.
  - print-site:
      add_to_navigation: false
      print_page_title: "SANDARC VEC Manual"
      add_table_of_contents: true
      toc_title: "Contents"
      toc_depth: 2
      # Enumeration counts the excluded Home page, so visible numbering
      # would start at "2" — keep headings unnumbered instead.
      enumerate_headings: false
      enumerate_figures: false
      add_cover_page: true
      cover_page_template: "docs/assets/templates/cover-page.tpl"
      exclude:
        # The hero landing page is web-only chrome; the PDF gets a
        # branded cover page instead.
        - index.md

hooks:
  - hooks/reading_time.py
  - hooks/git_changelog.py
  - hooks/locale_sitemaps.py

nav:
  - Home: index.md
  - Intro:
    - Being A Cool VE: Intro/Being-A-Cool-VE.md
    - Key Contacts: Intro/Key-Contacts.md
    - Other VECs: Intro/Other-VECs.md
  - Prepare For A Session:
    - Preparing for the Session: prepare-for-a-session/Preparing-for-the-Session.md
    - Session Day Checklist: prepare-for-a-session/Session-Day-Checklist.md
    - Exam Materials: prepare-for-a-session/Exam-Materials.md
    - Registering Applicants: prepare-for-a-session/registering-applicants.md
    - Getting an FRN: prepare-for-a-session/Getting-an-FRN.md
    - Minors and the COPPA Process: prepare-for-a-session/COPPA-and-Minors.md
  - Conduct A Session:
    - Conducting the Session: conduct-a-session/Conducting-the-Session.md
    - Remote Testing: conduct-a-session/remote-testing/Remote-Testing.md
    - Breakout Rooms: conduct-a-session/remote-testing/Breakout-Rooms.md
    - Fees and Reimbursement: conduct-a-session/Fees-and-Reimbursement.md
    - CSCE Overview: conduct-a-session/CSCE-Overview.md
    - Felony Question: conduct-a-session/Felony-Question.md
  - Post Session Information:
    - After the Session: post-session-information/After-the-Session.md
  - Start A Team:
    - Accrediting a VE: start-a-team/Accrediting-a-VE.md
    - Start a New Team: start-a-team/Start-A-New-Team.md

markdown_extensions:
  - md_in_html
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true
